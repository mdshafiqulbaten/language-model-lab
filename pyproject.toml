[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-model-lab"
version = "1.0.0"
description = "Companion code for Build Your Own Language Model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Md Shafiqul Baten Sumon"}]
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.2"]
test = ["pytest>=8"]

[project.scripts]
lmlab-doctor = "lmlab.doctor:main"
lmlab-smoke = "lmlab.smoke:main"
lmlab-tokenizer = "lmlab.tokenizer_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

